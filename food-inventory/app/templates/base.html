<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d5b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <title>{% block title %}Food Inventory{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>{% block heading %}Food Inventory{% endblock %}</h1>
  </header>

  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>

  <nav class="tabbar">
    <a href="/" class="{% block nav_inventory %}{% endblock %}">
      <span class="icon">&#9776;</span>Inventory
    </a>
    <a href="/shopping" class="{% block nav_shopping %}{% endblock %}">
      <span class="icon">&#128722;</span>Shopping
      {% if counts.shopping %}<span class="badge">{{ counts.shopping }}</span>{% endif %}
    </a>
    <a href="/capture" class="{% block nav_capture %}{% endblock %}">
      <span class="icon">&#10133;</span>Capture
    </a>
    <a href="/cook" class="{% block nav_cook %}{% endblock %}">
      <span class="icon">&#127859;</span>Cook
    </a>
    <a href="/review" class="{% block nav_review %}{% endblock %}">
      <span class="icon">&#128269;</span>Review
      {% if counts.review %}<span class="badge">{{ counts.review }}</span>{% endif %}
    </a>
  </nav>
</body>
</html>
